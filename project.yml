name: TravelEasy
options:
  bundleIdPrefix: com.timrodz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  TravelEasy:
    type: application
    platform: macOS
    sources:
      - path: TravelEasy
        excludes:
          - TravelEasy.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timrodz.traveleasy
        PRODUCT_NAME: TravelEasy
        CODE_SIGN_ENTITLEMENTS: TravelEasy/TravelEasy.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
